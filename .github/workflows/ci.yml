name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # Only trusted main pushes write the uv cache; PR runs restore but never save, so
  # nothing a PR controls can reach a cache entry, whatever the cache scoping rules.
  UV_CACHE_SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run-tests: ${{ steps.decide.outputs.run-tests }}
      os-matrix: ${{ steps.decide.outputs.os-matrix }}
      coverage-floor: ${{ steps.decide.outputs.coverage-floor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            src:
              - 'src/pyhaul/**'
            tests:
              - 'tests/**'
            os_sensitive:
              - 'src/pyhaul/alloc.py'
              - 'src/pyhaul/fs.py'
            lockfile:
              - 'uv.lock'
            config:
              - 'pyproject.toml'
            ci:
              - '.github/**'
            tooling:
              - 'tools/**'
              - 'scripts/**'
              - 'justfile'
              - 'renovate.json'
              - '.pre-commit-config.yaml'
            docs:
              - 'docs/**'
              - 'properdocs.yml'
              - '**/*.md'
      - name: Decide matrix scope
        id: decide
        env:
          ALWAYS_FULL: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
          CHANGED_SRC: ${{ steps.changes.outputs.src }}
          CHANGED_TESTS: ${{ steps.changes.outputs.tests }}
          CHANGED_OS: ${{ steps.changes.outputs.os_sensitive }}
          CHANGED_LOCK: ${{ steps.changes.outputs.lockfile }}
          CHANGED_CONFIG: ${{ steps.changes.outputs.config }}
          CHANGED_CI: ${{ steps.changes.outputs.ci }}
          CHANGED_TOOLING: ${{ steps.changes.outputs.tooling }}
        shell: bash
        run: |
          # run-tests: lockfile, config, CI, or tooling changes may affect build/test/security outputs.
          if [[ "$ALWAYS_FULL" == "true" || "$CHANGED_SRC" == "true" || "$CHANGED_TESTS" == "true" || "$CHANGED_LOCK" == "true" || "$CHANGED_CONFIG" == "true" || "$CHANGED_CI" == "true" || "$CHANGED_TOOLING" == "true" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
          fi

          # Tri-OS: trunk merges, lockfile changes, CI/tooling edits, or fs-sensitive code paths.
          if [[ "$ALWAYS_FULL" == "true" || "$CHANGED_OS" == "true" || "$CHANGED_LOCK" == "true" || "$CHANGED_CI" == "true" || "$CHANGED_TOOLING" == "true" ]]; then
            echo 'os-matrix=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo "coverage-floor=85" >> "$GITHUB_OUTPUT"
          else
            echo 'os-matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "coverage-floor=80" >> "$GITHUB_OUTPUT"
          fi

  # Not part of the CI green gate. Fork PRs get a read-only token, so labeling is skipped for them.
  label:
    name: Label PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # add a type label to the PR
    steps:
      - name: Label PR from conventional commit type
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^(\w+)(?:\(.*?\))?!?:/);
            if (!match) return;
            const typeToLabel = {
              feat: 'enhancement',
              fix: 'bug',
              docs: 'documentation',
              perf: 'performance',
              ci: 'ci',
              refactor: 'refactor',
              test: 'testing',
            };
            const label = typeToLabel[match[1]];
            if (!label) return;
            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo,
              issue_number: context.issue.number,
            });
            if (current.some(l => l.name === label)) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [label],
            });

  lint:
    name: Lint & type check
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: $/.github/actions/setup-uv-pinned
        with:
          python-version: "3.14"
          enable-cache: "true"
          save-cache: ${{ env.UV_CACHE_SAVE }}
      - name: Install project
        run: uv sync --locked --all-groups
      - name: ruff check
        run: uv run ruff check
      - name: ruff format --check
        run: uv run ruff format --check
      - name: mypy
        run: uv run mypy src tests
      - name: pyright
        run: uv run pyright
      - name: ty
        run: uv run ty check
      - name: codespell
        run: uv run codespell src tests docs examples
      - name: validate-pyproject
        run: uv run validate-pyproject pyproject.toml
      - name: interrogate
        run: uv run interrogate src/pyhaul/
      - name: prek hooks
        run: uv run prek run --all-files --show-diff-on-failure
        env:
          SKIP: check-commit-signing

  build:
    name: Build & inspect package
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp

  test-stable:
    name: Test (${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'macos' || 'ubuntu' }} / Python ${{ matrix.python-version }})
    needs: [plan, build]
    if: needs.plan.outputs.run-tests == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.plan.outputs.os-matrix) }}
        python-version: ${{ fromJson(needs.build.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist/
      # structlog: merge sdist tree into the workspace, then remove src/ so
      # imports cannot use the in-repo source tree; only the wheel (below) is used.
      - name: Unpack sdist and remove local src
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tgz=(dist/*.tar.gz)
          if [ ${#tgz[@]} -eq 0 ]; then
            echo "No sdist (.tar.gz) in dist/ — BAIPP should upload sdist" >&2
            exit 1
          fi
          tar -xzf "${tgz[0]}" --strip-components=1
          rm -rf src
      - name: Set up uv
        uses: $/.github/actions/setup-uv-pinned
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: "true"
          save-cache: ${{ env.UV_CACHE_SAVE }}
      - name: Install deps + wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          uv sync --frozen --all-groups --no-install-project
          whl=(dist/pyhaul-*.whl)
          uv pip install --force-reinstall --no-deps "${whl[0]}"
      # --no-sync: without src/, uv would try to build the workspace project; the wheel is already installed.
      # structlog: ``coverage run -m pytest`` (not ``pytest --cov``) so parallel data
      # files are consistently ``.coverage.*``; upload with that glob + hidden files.
      # Linux and macOS on 3.14 run every live backend; other rows run a rotating third (tests/live_backends.py).
      - name: Run tests (coverage)
        shell: bash
        env:
          PYHAUL_LIVE_MATRIX: ${{ (matrix.python-version == '3.14' && matrix.os != 'windows-latest') && 'full' || 'reduced' }}
        run: uv run --no-sync coverage run -m pytest
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}
          # structlog: ``path: .coverage.*``; include hidden files. Also upload
          # ``.coverage`` if a run produces a single main file (edge cases).
          path: |
            .coverage
            .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Ensure combined coverage threshold
    needs: [plan, test-stable]
    if: needs.plan.outputs.run-tests == 'true' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: $/.github/actions/setup-uv-pinned
        with:
          python-version: "3.14"
          enable-cache: "true"
          save-cache: ${{ env.UV_CACHE_SAVE }}
      - name: Install project
        run: uv sync --locked --all-groups
      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report
        env:
          COVERAGE_FLOOR: ${{ needs.plan.outputs.coverage-floor }}
        run: |
          uv run coverage combine
          uv run coverage html --skip-covered --skip-empty
          uv run coverage report --format=markdown >> "${GITHUB_STEP_SUMMARY}"
          uv run coverage report --fail-under="$COVERAGE_FLOOR"
          uv run coverage xml -o coverage.xml
      - name: Upload HTML report if check failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: htmlcov-report
          path: htmlcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          name: combined
          token: ${{ secrets.CODECOV_TOKEN }}

  test-prospective:
    name: Test (ubuntu / Python 3.15 preview, experimental)
    needs: [plan, lint]
    if: needs.plan.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: $/.github/actions/setup-uv-pinned
        with:
          enable-cache: "true"
          save-cache: ${{ env.UV_CACHE_SAVE }}
      # uv-managed CPython (python-build-standalone); avoids deadsnakes/Launchpad flakes on GHA.
      - name: Install CPython 3.15 preview
        run: uv python install 3.15
      # Only the `test` group: `lint` pulls semgrep → pydantic-core (Rust/PyO3) which
      # often lags CPython pre-releases; the lint job already runs on 3.14 in test-stable.
      - name: Install project
        run: uv sync --locked --python 3.15 --no-default-groups --group test
      - name: pytest
        run: uv run pytest

  test-floors:
    name: Test (ubuntu / Python 3.12 / HTTP client minimums)
    needs: [plan, lint]
    if: needs.plan.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: $/.github/actions/setup-uv-pinned
        with:
          python-version: "3.12"
          enable-cache: "true"
          save-cache: ${{ env.UV_CACHE_SAVE }}
      # lowest-direct installs each extra at its declared minimum; transitive deps stay at latest.
      - name: Install extras at their minimums
        run: |
          uv venv
          uv pip install --resolution lowest-direct --group test \
            -e ".[niquests,requests,httpx,urllib3,aiohttp,wreq]"
      - name: pytest
        run: .venv/bin/pytest

  install-dev:
    name: Verify extras install
    needs: [build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist/
      - name: Install wheel with all extras
        run: pip install "$(ls dist/pyhaul-*.whl)[niquests,requests,httpx,urllib3,aiohttp,wreq]"
      - name: Verify import
        run: python -c "import pyhaul; print(pyhaul.__version__)"

  meta:
    name: Validate CI config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: $/.github/actions/setup-uv-pinned
        with:
          python-version: "3.14"
          enable-cache: "true"
          save-cache: ${{ env.UV_CACHE_SAVE }}
      - name: Install prek
        run: uv sync --locked --only-group lint
      # The repo's pinned pre-push hooks: actionlint, workflow and Renovate schemas, zizmor.
      - name: Workflow and config hooks
        run: uv run --frozen prek run --hook-stage pre-push --all-files --show-diff-on-failure

  # Tools that reach the network at scan time (semgrep registry rules, OSV via
  # uv audit, zizmor's GitHub API audits) install and run only inside a
  # digest-pinned container: empty environment, read-only checkout, no
  # capabilities, no view of the runner process (whose memory holds the
  # cache-writing runtime token). Only zizmor's container gets GH_TOKEN, which
  # is contents: read. Findings land in an artifact; scan-gate judges them offline.
  online-scans:
    name: Online scans
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SCAN_IMAGE: ghcr.io/astral-sh/uv:0.12.17-python3.12-trixie-slim@sha256:9a59bb7206905ccaae4f7dab222fbac47c125a21e5fc16f43f427cd6c940ade3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the scan image's build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://${SCAN_IMAGE%%@*}@${SCAN_IMAGE##*@}" --repo astral-sh/uv
      - name: Run scanners in the container
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/scan-venv" "$RUNNER_TEMP/findings"
          run_scan() {
            docker run --rm --pull always --user "$(id -u):$(id -g)" \
              --read-only --tmpfs /tmp:rw,exec,size=4g --cap-drop ALL --security-opt no-new-privileges \
              --env HOME=/tmp "$@"
          }
          run_scan -v "$PWD:/src:ro" -v "$RUNNER_TEMP/scan-venv:/venv" -v "$RUNNER_TEMP/findings:/out" \
            "$SCAN_IMAGE" bash /src/.github/online-scans/scan.sh tools
          run_scan --env GH_TOKEN -v "$PWD:/src:ro" -v "$RUNNER_TEMP/scan-venv:/venv:ro" -v "$RUNNER_TEMP/findings:/out" \
            "$SCAN_IMAGE" bash /src/.github/online-scans/scan.sh zizmor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: online-scan-findings
          path: ${{ runner.temp }}/findings/
          if-no-files-found: error
          retention-days: 14

  scan-gate:
    name: Scan findings gate
    needs: [online-scans]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: online-scan-findings
          path: findings
      - name: Fail on findings
        run: |
          status=0
          zizmor=$(jq 'length' findings/zizmor.json) || { echo "::error::zizmor produced no valid report"; exit 1; }
          semgrep=$(jq '.results | length' findings/semgrep.json) || { echo "::error::semgrep produced no valid report"; exit 1; }
          audit=$(jq '.summary.vulnerabilities + .summary.adverse_statuses' findings/uv-audit.json) || { echo "::error::uv audit produced no valid report"; exit 1; }
          if (( audit > 0 )); then
            jq -r '.vulnerabilities[], .adverse_statuses[] | "::error::uv audit: \(tojson)"' findings/uv-audit.json
            status=1
          fi
          if (( zizmor > 0 )); then
            jq -r '.[] | .locations[0] as $l
              | "::error file=\($l.symbolic.key.Local.verbatim_path // "?"),line=\(($l.concrete.location.start_point.row // 0) + 1)::zizmor \(.ident): \(.desc)"' \
              findings/zizmor.json
            status=1
          fi
          if (( semgrep > 0 )); then
            jq -r '.results[] | "::error file=\(.path),line=\(.start.line)::semgrep \(.check_id): \(.extra.message)"' findings/semgrep.json
            status=1
          fi
          echo "zizmor: $zizmor finding(s); semgrep: $semgrep finding(s); uv audit: $audit finding(s)"
          exit "$status"

  ci-ok:
    name: CI green
    if: always()
    needs: [lint, build, test-stable, test-prospective, test-floors, install-dev, coverage, meta, scan-gate]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-failures: test-prospective
          allowed-skips: test-stable, test-prospective, test-floors, coverage
          jobs: ${{ toJSON(needs) }}
