name: PR title lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # The title was checked when the PR entered the merge queue; this reports the required check there.
  merge_group:

permissions:
  pull-requests: read # check PR title against conventional commit format

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    name: Enforce conventional commit PR title
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject "{subject}" must start with a lowercase letter.
