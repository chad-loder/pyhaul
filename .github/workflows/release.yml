name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml

jobs:
  # Holds the attestation OIDC token, so nothing here restores an Actions cache.
  # CI inspects the same build (build-and-inspect-python-package) on every PR and main push.
  build:
    name: Build & attest package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: $/.github/actions/setup-uv-pinned
      - name: Build sdist and wheel
        run: uv build --no-cache
      - name: Require the tag to match the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -f "dist/pyhaul-${TAG#v}-py3-none-any.whl"
          test -f "dist/pyhaul-${TAG#v}.tar.gz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Packages
          path: dist/
          if-no-files-found: error

  # The only job PyPI trusts: the pypi environment needs a reviewer and a v* tag.
  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyhaul
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist/
      - name: Verify build attestations came from this workflow and tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          for f in dist/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" --source-ref "$SOURCE_REF" --deny-self-hosted-runners
          done
      - uses: $/.github/actions/pypi-publish

  upload-immutable-assets:
    name: Attach assets to GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist/

      - name: Verify build attestations came from this workflow and tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          for f in dist/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" --source-ref "$SOURCE_REF" --deny-self-hosted-runners
          done

      - name: Generate checksums
        run: cd dist && sha256sum ./* > SHA256SUMS

      - name: Create draft release
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

      - name: Upload assets to release
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

      - name: Publish release (locks immutability)
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
