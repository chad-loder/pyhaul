name: Nightly

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for recent commits on main
        id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "Manual trigger — building unconditionally"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git rev-list --after='25 hours' HEAD)" ]; then
            echo "New commits on main in the last 25 hours"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits on main — skipping build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build nightly
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-uv-pinned

      # Ephemeral edit on the runner only — never committed or pushed to main.
      # hatchling reads __version__ from _version.py at build time.
      - name: Stamp dev version into _version.py
        id: ver
        run: |
          version=$(grep '__version__' src/pyhaul/_version.py | sed 's/.*"\(.*\)"/\1/')
          dev="${version}.dev$(date +%Y%m%d)"
          echo "__version__ = \"${dev}\"" > src/pyhaul/_version.py
          echo "dev=${dev}" >> "$GITHUB_OUTPUT"
          echo "::notice::Stamped pyhaul==${dev}"

      - name: Build
        run: uv build --no-cache --no-build --build-constraint .github/build-constraints.txt --require-hashes

      - name: Check distribution metadata
        run: uvx --no-cache twine@7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Packages
          path: dist/
          if-no-files-found: error

  # Holds the OIDC token; runs no build or project code.
  publish:
    name: Publish nightly to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyhaul
    permissions:
      contents: read
      id-token: write # Trusted Publishing (OIDC) and PEP 740 signing for TestPyPI
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist/
      - uses: $/.github/actions/pypi-publish
        with:
          publish-url: https://test.pypi.org/legacy/
          check-url: https://test.pypi.org/simple/
