name: Docs

# Versioned site on the gh-pages branch; see .github/scripts/deploy_docs.py.
# Run manually against a tag ("Use workflow from") to redeploy that release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "properdocs.yml"
      - "**/*.md"
      - "src/**"
      - ".github/workflows/docs.yml"
      - ".github/scripts/deploy_docs.py"
  workflow_dispatch:

permissions: {}

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  # Runs the docs toolchain (third-party plugins, hooks) with a read-only token.
  build:
    name: Build docs deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.deploy.outputs.branch }}
      bundle: ${{ steps.deploy.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --group docs
      - id: deploy
        name: Commit deploy to local pages branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: uv run --frozen python .github/scripts/deploy_docs.py
      - if: steps.deploy.outputs.bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-deploy
          path: ${{ steps.deploy.outputs.bundle }}
          retention-days: 1

  # Holds the write token; runs only git, and only fast-forwards the pages branch.
  publish:
    name: Publish docs
    needs: build
    if: needs.build.outputs.bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.branch }}
          persist-credentials: true # zizmor: ignore[artipacked] pushes the pages branch; uploads no artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-deploy
          path: ${{ runner.temp }}/docs-deploy
      - name: Fast-forward pages branch
        env:
          BRANCH: ${{ needs.build.outputs.branch }}
          BUNDLE: ${{ runner.temp }}/docs-deploy/${{ needs.build.outputs.bundle }}
        run: |
          git fetch --quiet "$BUNDLE" "$BRANCH:refs/deploy/$BRANCH"
          git push --quiet origin "refs/deploy/$BRANCH:refs/heads/$BRANCH"
