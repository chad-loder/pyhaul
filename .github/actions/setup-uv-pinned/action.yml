name: Set up pinned uv
description: >-
  Installs a fixed uv release, verified against the SHA-256 that the pinned
  setup-uv commit embeds for that version, with the Actions cache off.
  For jobs that build, sign, publish, or deploy.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.17" # renovate: datasource=github-releases depName=astral-sh/uv
        enable-cache: false
